[package]
name = "actualizador-ofertas"
version = "2.0.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["derive", "postgres", "runtime-tokio"] }
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }

[dev-dependencies]
tracing-test = "0.2.6"
